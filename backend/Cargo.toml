[package]
name    = "backend"
version = "0.1.0"
edition = "2021"

[lib]
name    = "backend"
path    = "src/lib.rs"

[[bin]]
name = "backend"
path = "src/main.rs"

[dependencies]
shared = { path = "../shared" }

# Async
tokio = { version = "1", features = ["full"] }

# Web framework
axum        = { version = "0.7", features = ["multipart"] }
tower       = "0.4"
tower-http  = { version = "0.5", features = ["cors", "trace", "fs", "compression-full"] }

# Database
sqlx = { version = "0.7", features = [
    "runtime-tokio-native-tls",
    "postgres",
    "uuid",
    "chrono",
    "rust_decimal",
    "migrate",
    "json",
] }

# Serde
serde        = { workspace = true }
serde_json   = "1"

# Types
uuid         = { workspace = true }
chrono       = { workspace = true }
rust_decimal = { workspace = true }

# Auth
jsonwebtoken = "9"
argon2       = "0.5"
rand         = "0.8"
sha2         = "0.10"
hex          = "0.4"

# Error handling
thiserror = { workspace = true }
anyhow    = "1"

# Logging
tracing            = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# OpenAPI
utoipa             = { version = "4", features = ["axum_extras", "chrono", "decimal", "uuid"] }
utoipa-swagger-ui  = { version = "6", features = ["axum"] }

# HTTP client (exchange rate API)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Job scheduling
tokio-cron-scheduler = "0.10"

# Excel export
rust_xlsxwriter = "0.68"

# CSV export
csv = "1"

# Config
dotenvy = "0.15"

[dev-dependencies]
tokio      = { version = "1", features = ["full", "test-util"] }
sqlx       = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "migrate", "rust_decimal", "uuid", "chrono"] }
tower      = { version = "0.4", features = ["util"] }
