version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ledger_rs
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger_rs"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ledger:ledger_secret@db:5432/ledger_rs
      JWT_SECRET: changeme_in_production_use_a_long_random_secret
      EXCHANGE_RATE_API_URL: https://api.exchangerate.host
      PORT: 8080
      FRONTEND_DIST: /app/frontend/dist
    ports:
      - "8080:8080"

volumes:
  pgdata:
