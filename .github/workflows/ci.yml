name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  # ── Backend: lint + test ──────────────────────────────────────────────────
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ledger_rs_test
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledger -d ledger_rs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (backend + shared)
        run: cargo clippy -p backend -p shared -- -D warnings

      - name: Run migrations + integration tests
        env:
          DATABASE_URL: postgres://ledger:ledger_secret@localhost:5432/ledger_rs_test
          JWT_SECRET: test_secret_key_32chars_minimum!!
          SQLX_OFFLINE: "false"
        run: |
          cargo install sqlx-cli --no-default-features --features postgres
          sqlx database create
          sqlx migrate run
          cargo test -p backend -- --test-threads=1

  # ── Frontend: check (no WASM build in CI for speed) ──────────────────────
  frontend-check:
    name: Frontend (check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust + wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-frontend-${{ hashFiles('**/Cargo.lock') }}
      - name: cargo check (frontend)
        run: cargo check -p frontend --target wasm32-unknown-unknown

  # ── Docker build smoke test ──────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend-check]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t ledger-rs:ci .
